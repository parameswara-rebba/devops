# Dev: syncs automatically. Any commit to master is deployed, manual changes
# in the cluster are reverted (selfHeal), and deleted manifests are removed (prune).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: web
  source:
    repoURL: https://github.com/parameswara-rebba/devops.git
    targetRevision: master
    path: gitops-argocd/workloads/web/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: web-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
